[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sperm"
version = "0.0.2"
authors = [
  { name="Xiang CHEN", email="xiangchen.ai@outlook.com" },
]
description = "SPERM (Shape Prior Embedded Regression Models) targets providing flexible shape prior embeddings into base regression models."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
  "machine-learning",
  "regression",
  "scikit-learn",
  "shape-constraints",
  "shape-priors",
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.6",
  "scipy>=1.10",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]
examples = [
  "matplotlib",
]
docs = [
  "myst-parser",
  "pydata-sphinx-theme",
  "sphinx",
  "sphinx-copybutton",
  "sphinx-design",
]
dev = [
  "matplotlib",
  "myst-parser",
  "pydata-sphinx-theme",
  "pytest>=8,<9",
  "pytest-cov",
  "ruff",
  "sphinx",
  "sphinx-copybutton",
  "sphinx-design",
]

[project.urls]
Homepage = "https://xiangchen-dvi.github.io/sperm/"
Documentation = "https://xiangchen-dvi.github.io/sperm/"
Repository = "https://github.com/XiangCHEN-dvi/sperm"
Issues = "https://github.com/XiangCHEN-dvi/sperm/issues"
PyPI = "https://pypi.org/project/sperm/"

[tool.hatch.build.targets.wheel]
packages = ["src/sperm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
